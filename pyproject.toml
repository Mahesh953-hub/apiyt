[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apiyt"
version = "1.0.0"
description = "Browserless YouTube-to-MP3 CLI with a rich terminal UI"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "cryptography>=39",
    "rich>=13",
]

[project.scripts]
apiyt = "cli:main"

[tool.setuptools]
py-modules = ["cli", "core"]
